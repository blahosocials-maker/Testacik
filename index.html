<!DOCTYPE html>
      <h2>Naše pizze</h2>
      <div class="menu" id="menu"></div>

      <div class="section">
        <h2>Extra prílohy</h2>
        <div class="extras" id="extras"></div>
      </div>

      <div class="section">
        <h2>Údaje zákazníka</h2>
        <label>Meno</label><input id="name" placeholder="Tvoje meno" />
        <label>Discord</label><input id="discord" placeholder="napr. marek#0001" />
        <label>Zamestnanec</label>
        <select id="employee">
          <option value="PizzaThis objednávky">PizzaThis objednávky</option>
          <option value="Zamestnanec 1">Zamestnanec 1</option>
          <option value="Zamestnanec 2">Zamestnanec 2</option>
          <option value="Rozvoz">Rozvoz</option>
        </select>
        <label>Typ objednávky</label>
        <select id="delivery"><option>Osobný odber</option><option>Doručenie</option></select>
        <label>Adresa / poznámka</label><textarea id="note" placeholder="Kam doručiť, poznámka, RP info..."></textarea>
        <button onclick="submitOrder()">Odoslať objednávku</button>
        <div id="status" class="status"></div>
      </div>
    </section>

    <aside class="card">
      <h2>Košík</h2>
      <div id="cart"><p class="empty">Zatiaľ nič nevybraté.</p></div>
      <div class="total"><span>Spolu</span><span id="total">0.00 €</span></div>
      <p class="note">Poznámka: Discord login je zatiaľ vizuálny. Reálne Discord prihlásenie potrebuje backend/OAuth.</p>
    </aside>
  </main>

  <footer>PizzaThis © 2026</footer>

  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1500263623141101569/yfXmf21frS4OadhlDNd8OkdBzGRsOxsKHbr3FtpFTXGFp72j2NFd2oN5JRMYqxzMjEeI";

    const pizzas = [
      {name:"Margherita",desc:"Paradajkový základ, mozzarella, bazalka",price:6.50,img:"https://images.unsplash.com/photo-1604068549290-dea0e4a305ca?auto=format&fit=crop&w=900&q=80"},
      {name:"Pepperoni",desc:"Mozzarella, pepperoni, paradajkový základ",price:8.00,img:"https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=900&q=80"},
      {name:"Hawai",desc:"Šunka, ananás, syr",price:7.50,img:"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=900&q=80"},
      {name:"Diavola",desc:"Pikantná saláma, chilli, mozzarella",price:8.70,img:"https://images.unsplash.com/photo-1594007654729-407eedc4be65?auto=format&fit=crop&w=900&q=80"},
      {name:"Quattro Formaggi",desc:"4 druhy syra, krémová chuť",price:8.50,img:"https://images.unsplash.com/photo-1571997478779-2adcbbe9ab2f?auto=format&fit=crop&w=900&q=80"},
      {name:"PizzaThis Special",desc:"Slanina, šunka, kukurica, BBQ omáčka",price:9.20,img:"https://images.unsplash.com/photo-1548369937-47519962c11a?auto=format&fit=crop&w=900&q=80"}
    ];

    const extrasList=[
      {name:"Extra syr",price:1.00},{name:"Slanina",price:1.20},{name:"Kukurica",price:.80},{name:"Chilli",price:.50},{name:"Cesnakový dresing",price:.90},{name:"BBQ omáčka",price:.90}
    ];
    const selected={pizzas:[],extras:[]};

    function render(){
      const menuEl = document.getElementById('menu');
      const extrasEl = document.getElementById('extras');
      menuEl.innerHTML = pizzas.map((p,i)=>`<div class="pizza" id="p${i}" onclick="togglePizza(${i})"><img src="${p.img}"><div class="pizza-body"><div class="pizza-top"><strong>${p.name}</strong><span class="price">${p.price.toFixed(2)} €</span></div><small>${p.desc}</small></div></div>`).join('');
      extrasEl.innerHTML = extrasList.map((e,i)=>`<label class="extra"><input type="checkbox" onchange="toggleExtra(${i})">${e.name} — <span class="price">${e.price.toFixed(2)} €</span></label>`).join('');
    }
    function togglePizza(i){const p=pizzas[i];const has=selected.pizzas.find(x=>x.name===p.name);if(has){selected.pizzas=selected.pizzas.filter(x=>x.name!==p.name);document.getElementById('p'+i).classList.remove('selected')}else{selected.pizzas.push(p);document.getElementById('p'+i).classList.add('selected')}updateCart()}
    function toggleExtra(i){const e=extrasList[i];const has=selected.extras.find(x=>x.name===e.name);selected.extras=has?selected.extras.filter(x=>x.name!==e.name):[...selected.extras,e];updateCart()}
    function updateCart(){const all=[...selected.pizzas,...selected.extras];const sum=all.reduce((a,b)=>a+b.price,0);document.getElementById('cart').innerHTML=all.length?all.map(i=>`<div class="cart-line"><span>${i.name}</span><span>${i.price.toFixed(2)} €</span></div>`).join(''):'<p class="empty">Zatiaľ nič nevybraté.</p>';document.getElementById('total').textContent=sum.toFixed(2)+' €'}
    async function submitOrder(){
      const all=[...selected.pizzas,...selected.extras];
      const status=document.getElementById('status');
      if(!name.value.trim()||!discord.value.trim()){status.className='status bad';status.textContent='Vyplň meno a Discord.';return}
      if(!all.length){status.className='status bad';status.textContent='Vyber aspoň jednu položku.';return}
      const sum=all.reduce((a,b)=>a+b.price,0).toFixed(2);
      const text=`🍕 **NOVÁ OBJEDNÁVKA — PizzaThis**

👤 **Meno:** ${name.value}
💬 **Discord:** ${discord.value}
👷 **Zamestnanec:** ${employee.value}
🚗 **Typ:** ${delivery.value}
📝 **Poznámka:** ${note.value||'žiadna'}

📦 **Položky:**
${all.map(i=>`• ${i.name} — ${i.price.toFixed(2)} €`).join('
')}

💰 **Spolu:** ${sum} €`;
      if(DISCORD_WEBHOOK_URL==='SEM_DAJ_DISCORD_WEBHOOK_URL'){alert(text);status.className='status ok';status.textContent='Objednávka sa ukázala ako náhľad. Doplň webhook URL, aby chodila na Discord.';return}
      try{await fetch(DISCORD_WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text})});status.className='status ok';status.textContent='Objednávka odoslaná na Discord.'}
      catch(e){status.className='status bad';status.textContent='Nepodarilo sa odoslať objednávku. Skontroluj webhook.'}
    }
    render();
  </script>
</body>
</html>
